name: ticket

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=512MB", "-c", "synchronous_commit=on"]
    ports: ["${POSTGRES_PORT}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy: { resources: { limits: { cpus: "4", memory: 4G } } }

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    ports: ["${REDIS_PORT}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
    deploy: { resources: { limits: { cpus: "1", memory: 512M } } }

  mailpit:
    image: axllent/mailpit:v1.27
    environment: { MP_MAX_MESSAGES: "5000" }
    ports: ["${MAILPIT_UI_PORT}:8025", "${MAILPIT_SMTP_PORT}:1025"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8025/livez || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
    deploy: { resources: { limits: { cpus: "0.5", memory: 128M } } }

  # SeaweedFS S3 gateway. The S3 identity comes from a config file written at startup (spike S-01:
  # without -s3.config every signed request fails with "requires setting up SeaweedFS S3 authentication").
  storage:
    image: chrislusf/seaweedfs:${SEAWEEDFS_TAG}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List"]}]}' \
          "$$STORAGE_S3_ACCESS_KEY" "$$STORAGE_S3_SECRET_KEY" > /tmp/s3.json
        exec /entrypoint.sh server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=20
    environment:
      STORAGE_S3_ACCESS_KEY: "${STORAGE_S3_ACCESS_KEY}"
      STORAGE_S3_SECRET_KEY: "${STORAGE_S3_SECRET_KEY}"
    volumes: ["storage-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy: { resources: { limits: { cpus: "1", memory: 512M } } }

  api:
    build: { context: ../.., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      SERVER_PORT: "8081"
      MANAGEMENT_SERVER_PORT: "9090"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    stop_grace_period: 30s
    deploy: { resources: { limits: { cpus: "4", memory: 2G } } }

  nginx:
    build:
      context: ../..
      dockerfile: deploy/compose/nginx/Dockerfile
      args:
        VITE_PAYMENTS: "${PAYMENTS_MODE}"
        VITE_STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY}"
    environment: { RATE_LIMIT_ALLOWLIST: "${RATE_LIMIT_ALLOWLIST}" }
    ports: ["${NGINX_PORT}:80"]
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
    deploy: { resources: { limits: { cpus: "0.5", memory: 128M } } }

  stripe-cli:
    profiles: ["stripe"]
    image: stripe/stripe-cli:v1.30
    command: ["listen", "--api-key", "${STRIPE_SECRET_KEY}", "--forward-to", "http://api:8081/api/v1/webhooks/stripe", "--print-secret"]
    depends_on: { api: { condition: service_healthy } }
    deploy: { resources: { limits: { cpus: "0.25", memory: 64M } } }

volumes:
  postgres-data: {}
  storage-data: {}
