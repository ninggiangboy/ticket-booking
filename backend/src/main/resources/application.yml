spring:
  application:
    name: ticket-booking
  threads:
    virtual:
      enabled: false
  datasource:
    url: jdbc:postgresql://postgres:5432/ticket
    username: ticket
    hikari:
      maximum-pool-size: 40
      connection-timeout: 1000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: true
    ignore-migration-patterns: "*:missing"
  data:
    redis:
      host: redis
      port: 6379
      timeout: PT0.2S
  mail:
    host: mailpit
    port: 1025
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 8081
  shutdown: graceful

management:
  health:
    redis:
      enabled: false
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redisStartup,storage

logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

app:
  name: ticket
  base-url: http://localhost:8080
  domain: ticket.localhost

storage:
  s3:
    endpoint: http://storage:8333
    region: us-east-1
    bucket: ticket-media
    path-style: true
