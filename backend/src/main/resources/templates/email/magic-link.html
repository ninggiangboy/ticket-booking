<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{email.magic-link.subject}">Sign-in link</title>
</head>
<body style="margin:0;padding:0;background:#ECEEF1;">
  <div style="display:none;max-height:0;overflow:hidden" th:text="#{email.magic-link.preheader(${appName}, ${linkUrl}, ${expiresInMinutes})}">preheader</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ECEEF1;">
    <tr><td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#FFFFFF;border-radius:6px;">
        <tr><td style="padding:32px;font-family:'Be Vietnam Pro','Segoe UI',Arial,sans-serif;color:#2E323C;font-size:15px;line-height:1.5;">
          <div style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:22px;color:#12141A;"><span th:text="${appName}">ticket</span><span style="color:#D63312;">.</span></div>
          <h1 style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;text-transform:uppercase;font-size:28px;color:#12141A;margin:16px 0 8px;" th:text="#{email.magic-link.title(${appName})}">Sign in</h1>
          <p style="margin:0 0 20px;" th:text="#{email.magic-link.body}">Click button below to sign in.</p>
          <table role="presentation" cellpadding="0" cellspacing="0" style="margin:20px 0;"><tr>
            <td bgcolor="#12141A" style="border-radius:6px;"><a th:href="${linkUrl}" href="#" style="display:inline-block;padding:15px 24px;color:#FFFFFF;font-weight:700;font-size:16px;text-decoration:none;" th:text="#{email.magic-link.cta}">Sign in</a></td>
          </tr></table>
          <p style="margin:16px 0 4px;color:#5B6272;font-size:13px;" th:text="#{email.magic-link.fallback}">If button doesn't work:</p>
          <p style="margin:0 0 20px;font-size:13px;word-break:break-all;"><a th:href="${linkUrl}" th:text="${linkUrl}" href="#" style="color:#D63312;">http://...</a></p>
          <div style="border-top:2px dashed #B9BEC8;padding-top:16px;margin-top:16px;color:#5B6272;font-size:13px;" th:text="#{email.magic-link.note(${appName}, ${linkUrl}, ${expiresInMinutes})}">note</div>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
