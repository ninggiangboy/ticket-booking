openapi: 3.1.0
info:
  title: Ticket API
  version: v1
  description: >-
    Contract for the ticket booking API. DOC-37 (docs/07-api/api-endpoints.md) is the source of truth;
    this file follows it endpoint by endpoint. `make contract` compares the OpenAPI generated by springdoc
    with this file for the endpoints implemented so far; the frontend generates `src/api/schema.d.ts` from it.
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: catalog
security:
  - cookieAuth: []
paths:
  /auth/magic-link:
    post:
      tags: [auth]
      operationId: requestMagicLink
      summary: Request a sign-in link by email (E-01)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagicLinkRequest" }
            example: { email: "An@Example.com ", returnTo: "/events/0199b1c2-7a3e-7c40-8f11-2d5e9a6b0c34", locale: vi }
      responses:
        "202":
          description: Link sent, or throttled when `X-Magic-Link-Throttled` is present.
          headers:
            X-Magic-Link-Throttled:
              description: "`1` when the per-email or per-IP limit was reached; no email was sent."
              schema: { type: string, enum: ["1"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MagicLinkResponse" }
              example: { status: SENT, email: an@example.com, expiresInSeconds: 900 }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503":
          description: "`EMAIL_PROVIDER_UNAVAILABLE` or `OVERLOADED`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /auth/verify:
    post:
      tags: [auth]
      operationId: verifyMagicLink
      summary: Exchange a sign-in token for a session (E-02)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyRequest" }
            example: { token: q3J2k0wYb7nQ1u8Z5cXfHh3aT9mEoVd4LpS6iNgR2yA }
      responses:
        "200":
          description: Session created; `Set-Cookie` carries `tb_session`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyResponse" }
              example:
                userId: 0199a000-1111-7222-8333-444455556666
                email: an@example.com
                locale: vi
                roles: [BUYER]
                organizer: null
                csrfToken: Qm9ZpL1xVw3Rk8TnYc2HfJ6uSd0aEiGb4PzOq7MtXlA
                serverTime: 1795050601234
                returnTo: /events/0199b1c2-7a3e-7c40-8f11-2d5e9a6b0c34
        "401":
          description: "`LOGIN_LINK_INVALID`: expired, used, superseded or unknown."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out (E-03)
      security:
        - cookieAuth: []
          csrf: []
      responses:
        "204": { description: Signed out; the session cookie is cleared. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current account, roles and CSRF token (E-04)
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
              example:
                userId: 0199a000-1111-7222-8333-444455556666
                email: an@example.com
                locale: vi
                roles: [BUYER, ORGANIZER]
                organizer: { organizerId: 0199a000-2222-7333-8444-555566667777, name: Giao Mùa Studio }
                csrfToken: Qm9ZpL1xVw3Rk8TnYc2HfJ6uSd0aEiGb4PzOq7MtXlA
                serverTime: 1795050601234
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [auth]
      operationId: updateMe
      summary: Change the interface language (E-05)
      security:
        - cookieAuth: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
            example: { locale: en }
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /events/{eventId}:
    get:
      tags: [catalog]
      operationId: getEvent
      summary: Public event detail and ticket types (E-07)
      security: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Event; `DRAFT` and unknown events are 404.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetail" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: tb_session }
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: "`csrfToken` from `POST /auth/verify` or `GET /me`; required on writes with a session (DR-22)."
  responses:
    Problem:
      description: RFC 9457 Problem Details.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationProblem:
      description: "`VALIDATION_FAILED` with per-field errors."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblem" }
  schemas:
    Locale:
      type: string
      enum: [vi, en]
    Role:
      type: string
      enum: [BUYER, ORGANIZER]
    MagicLinkRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }
        returnTo: { type: string, maxLength: 512 }
        locale: { $ref: "#/components/schemas/Locale" }
    MagicLinkResponse:
      type: object
      required: [status, email, expiresInSeconds]
      properties:
        status: { type: string, enum: [SENT, THROTTLED] }
        email: { type: string }
        expiresInSeconds: { type: integer }
    VerifyRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 43, maxLength: 43 }
    OrganizerBrief:
      type: object
      required: [organizerId, name]
      properties:
        organizerId: { type: string, format: uuid }
        name: { type: string }
    Me:
      type: object
      required: [userId, email, locale, roles, organizer, csrfToken, serverTime]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        organizer:
          oneOf:
            - $ref: "#/components/schemas/OrganizerBrief"
            - type: "null"
        csrfToken: { type: string }
        serverTime: { type: integer, format: int64 }
    VerifyResponse:
      allOf:
        - $ref: "#/components/schemas/Me"
        - type: object
          required: [returnTo]
          properties:
            returnTo: { type: string }
    UpdateMeRequest:
      type: object
      additionalProperties: false
      required: [locale]
      properties:
        locale: { $ref: "#/components/schemas/Locale" }
    DisplayStatus:
      type: string
      enum: [DRAFT, UPCOMING, ON_SALE, SOLD_OUT, SALE_CLOSED, PAUSED, ENDED, CANCELLED]
    PublicTicketType:
      type: object
      required: [ticketTypeId, name, model, price, currency, colorIndex, soldOut]
      properties:
        ticketTypeId: { type: string, format: uuid }
        name: { type: string }
        model: { type: string, enum: [SEAT, ZONE, GA] }
        price: { type: integer, format: int64 }
        currency: { type: string, enum: [VND] }
        colorIndex: { type: integer, minimum: 1, maximum: 5 }
        soldOut: { type: boolean }
    EventDetail:
      type: object
      required:
        [eventId, name, description, venue, timezone, imageUrl, startsAt, endsAt, saleStartsAt, saleEndsAt,
         displayStatus, highDemand, holdMinutes, hasSeatMap, mapVersion, organizer, ticketTypes]
      properties:
        eventId: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        venue: { type: string }
        timezone: { type: string }
        imageUrl: { type: [string, "null"] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        saleStartsAt: { type: string, format: date-time }
        saleEndsAt: { type: string, format: date-time }
        displayStatus: { $ref: "#/components/schemas/DisplayStatus" }
        highDemand: { type: boolean }
        holdMinutes: { type: integer }
        hasSeatMap: { type: boolean }
        mapVersion: { type: [integer, "null"] }
        organizer:
          type: object
          required: [name, contactEmail]
          properties:
            name: { type: string }
            contactEmail: { type: string }
        ticketTypes:
          type: array
          items: { $ref: "#/components/schemas/PublicTicketType" }
    Problem:
      type: object
      required: [type, title, status, detail, code, requestId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        requestId: { type: string }
        retryAfterSeconds: { type: integer }
    FieldError:
      type: object
      required: [field, rule, params]
      properties:
        field: { type: string }
        rule: { type: string }
        params:
          type: [object, "null"]
          additionalProperties: true
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items: { $ref: "#/components/schemas/FieldError" }
